<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline – Rick & Morty Portal</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1b2a;
      color: #14ffd0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 2rem;
    }

    p {
      color: #c9d6df;
    }

    img {
      width: 180px;
      margin-top: 20px;
      opacity: 0.9;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #14ffd0;
      color: #003b2b;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>No Internet Connection</h1>
  <p>You are currently offline.<br>Try again when you're connected to the multiverse.</p>

  <img src="assets/offline-rick.png" alt="offline">
  <br>

  <a href="/">Return Home</a>
</body>
</html>
