@if (loading) {
  <div class="loading">
    <span class="spinner">LOADING</span>
    Loading Fighter Profile...
  </div>
}

@if (error) {
  <div class="error">
    <p>⚠️ Error loading fighter details.</p>
    <button (click)="appRouter.navigate(['/fighters'])">Back to Roster</button>
  </div>
}

@if (fighter$ | async; as fighter) {
  <div class="fighter-card-details">
    <!-- your template stays exactly the same -->
  </div>
}
