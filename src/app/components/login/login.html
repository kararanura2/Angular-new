<div class="auth-wrapper">
  <div class="auth-card">

    <div class="header">
      <h2>Portal Access</h2>
      <p>Enter Galactic Credentials</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <div class="group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" required placeholder="morty@citadel.space">
      </div>

      <div class="group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="!loginForm.valid || loading">
        @if (loading) {
          <span class="spinner"></span> ACCESSING...
        } @else {
          LOGIN
        }
      </button>
    </form>

    <div class="switch">
      No account? <a [routerLink]="['/signup']">Create Profile</a>
    </div>
  </div>
</div>
