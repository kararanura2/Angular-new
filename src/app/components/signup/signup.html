<div class="auth-container">
  <div class="auth-card signup-card">
    <div class="header">
      <h2>CREATE FIGHTER PROFILE</h2>
      <p>SECURE YOUR PLACE IN THE OCTAGON</p>
    </div>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">
      
      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <div class="form-group">
        <label for="email">OCTAGON EMAIL</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          autocomplete="off"
          placeholder="champion@ufc.com"
        >
      </div>

      <div class="form-group">
        <label for="password">PASSCODE</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Minimum 6 characters"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">CONFIRM PASSCODE</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          placeholder="RE-ENTER PASSCODE"
        >
      </div>

      <button type="submit" [disabled]="!signupForm.valid || loading">
        @if (loading) {
          <span class="spinner"></span>
          <span>INITIATING...</span>
        } @else {
          <span>SIGN UP</span>
        }
      </button>
    </form>
    
    <div class="switch-auth">
      Already have an account? <a [routerLink]="['/login']">Log In</a>
    </div>
  </div>
</div>
