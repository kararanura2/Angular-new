<div class="auth-wrapper">
  <div class="auth-card">

    <div class="header">
      <h2>Create Portal Profile</h2>
      <p>Join the Multiverse Registry</p>
    </div>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <div class="group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" required placeholder="rick@c-137.space">
      </div>

      <div class="group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" required placeholder="Minimum 6 characters">
      </div>

      <div class="group">
        <label>Confirm Password</label>
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      </div>

      <button type="submit" [disabled]="!signupForm.valid || loading">
        @if (loading) {
          <span class="spinner"></span> INITIATING...
        } @else {
          SIGN UP
        }
      </button>
    </form>

    <div class="switch">
      Already have an account? <a [routerLink]="['/login']">Log In</a>
    </div>

  </div>
</div>
