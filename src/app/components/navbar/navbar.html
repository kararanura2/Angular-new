<header class="navbar">
  <div class="logo">
    <h1><a [routerLink]="['/']">UFC Fan-Service</a></h1>
  </div>
  
  <nav>
    <ul>
      <li>
        <a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      </li>
      <li>
        <a [routerLink]="['/fighters']" routerLinkActive="active">Fighters</a>
      </li>
      <li>
        <a [routerLink]="['/about']" routerLinkActive="active">About</a>
      </li>
      
      <!-- AUTH LINKS TOGGLE -->
      @if (authService.currentUser$ | async; as user) {
        <!-- LOGGED IN STATE: Show Profile and Logout -->
        <li>
          <a [routerLink]="['/profile']" routerLinkActive="active">Profile</a>
        </li>
        <li>
          <a class="logout-link" (click)="logout()">Logout</a>
        </li>
      } @else {
        <!-- GUEST STATE: Show Login and Signup -->
        <li>
          <a [routerLink]="['/login']" routerLinkActive="active">Login</a>
        </li>
        <li>
          <a [routerLink]="['/signup']" routerLinkActive="active">Signup</a>
        </li>
      }
    </ul>
  </nav>
</header>
