<div class="card-wrapper">

  <!-- HEART BUTTON -->
  <button 
    class="favorite-btn"
    [class.active]="isFavorite(character.id)"
    (click)="toggleFavorite($event)">
    ❤️
  </button>

  <a class="card-link" [routerLink]="['/characters', character.id]" (click)="viewDetails()">
    <div class="card">

      <div class="image-container">
        <img [src]="character.image" [alt]="character.name" loading="lazy" />

        <!-- STATUS BADGE FIXED -->
        <span class="details-status-badge">{{ character.status }}</span>

      </div>

      <div class="info">
        <h3 class="name">{{ character.name }}</h3>

        <div class="meta">
          <span class="chip">{{ character.species }}</span>
          <span class="chip">{{ character.gender }}</span>
        </div>

        <p class="location">📍 {{ character.location?.name }}</p>

        <div class="details-button">VIEW DETAILS →</div>
      </div>

    </div>
  </a>
</div>
